name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, api]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project != 'api' && matrix.project || '' }}

      - name: Run tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          USERNAME: ${{ vars.USERNAME }}
          PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npx playwright test --project=${{ matrix.project }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate reports/allure-results --clean -o reports/allure-report || true

      - name: Upload test artifacts (reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            reports/html-report
            reports/allure-report
            reports/results.json
            reports/junit-results.xml
            reports/ai-analysis.json
          retention-days: 14

      - name: Upload failure artifacts (screenshots/videos/traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.project }}
          path: test-results/
          retention-days: 14

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results (${{ matrix.project }})
          path: reports/junit-results.xml
          reporter: java-junit
          fail-on-error: false
